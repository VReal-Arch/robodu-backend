# Production Mosquitto config — auth required, no anonymous access.
# Plain MQTT for the backend + robots on the same Docker network (internal only):
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# TLS listener for robots connecting over the public internet:
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem

# Optional: MQTT-over-WebSocket, TLS, for browser-based tools
listener 8081
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem

persistence true
persistence_location /mosquitto/data/
log_dest stdout
